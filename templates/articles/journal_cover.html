{% extends 'base.html' %}

{% block content %}
<!-- Page Header -->
<div class="page-header">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div>
                <h1 class="mb-1">Journal Cover Page</h1>
                <p class="mb-0">Preview and download the issue cover</p>
            </div>
            <a href="javascript:history.back()" class="btn btn-outline-light btn-sm rounded-pill px-3">
                <i class="bi bi-arrow-left me-1"></i>Back
            </a>
        </div>
    </div>
</div>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-6">
            <div class="card-modern mb-4">
                <div class="card-body p-4 text-center">
                    {% if cover_png %}
                        <img src="data:image/png;base64,{{ cover_png }}" alt="Journal Cover Preview"
                             class="img-fluid rounded shadow-sm mb-3" style="max-height: 620px; border: 1px solid #ddd;">
                    {% else %}
                        <div class="alert alert-warning">
                            <i class="bi bi-exclamation-triangle me-2"></i>
                            Preview could not be rendered. You can still download the cover below.
                        </div>
                    {% endif %}
                    <div class="d-flex justify-content-center gap-2 flex-wrap">
                        <a href="{% url 'download_journal_cover' %}" class="btn btn-primary rounded-pill px-4">
                            <i class="bi bi-download me-1"></i>Download Cover Page (PDF)
                        </a>
                        <a href="{% url 'download_journal_toc' %}" class="btn btn-outline-primary rounded-pill px-4">
                            <i class="bi bi-list-ol me-1"></i>Table of Contents
                        </a>
                        <a href="{% url 'download_editorial_board' %}" class="btn btn-outline-primary rounded-pill px-4">
                            <i class="bi bi-people me-1"></i>Editorial Board
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
